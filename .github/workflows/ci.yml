name: Quality gates and Pages preview
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Test Yandex package validator
        run: python3 -m unittest discover -s scripts -p test_check_yandex_build.py -v
      - name: Validate Yandex production tree
        run: python3 scripts/check-yandex-build.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist
          if-no-files-found: error
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/configure-pages@v5
      - name: Upload Pages build
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  verify:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            shard: 1/4
            artifact: chromium-1
          - browser: chromium
            shard: 2/4
            artifact: chromium-2
          - browser: chromium
            shard: 3/4
            artifact: chromium-3
          - browser: chromium
            shard: 4/4
            artifact: chromium-4
          - browser: firefox
            shard: 1/1
            artifact: firefox
          - browser: webkit
            shard: 1/1
            artifact: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.artifact }}
          path: |
            test-results
            blob-report
          if-no-files-found: error

  yandex-release:
    name: Yandex upload-ready ZIP
    needs: [build, verify]
    if: ${{ success() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist
      - name: Recheck the exact tested production tree
        run: python3 scripts/check-yandex-build.py dist
      # Upload the directory contents, never a prebuilt ZIP: the GitHub download
      # itself must have index.html at its root and must not contain another ZIP.
      - name: Publish Yandex upload-ready files
        id: ready
        uses: actions/upload-artifact@v4
        with:
          name: yandex-upload-ready
          path: dist
          if-no-files-found: error
          overwrite: true
      - name: Verify the actual downloadable ZIP against production-dist
        env:
          GH_TOKEN: ${{ github.token }}
          YANDEX_ARTIFACT_ID: ${{ steps.ready.outputs.artifact-id }}
          YANDEX_ARTIFACT_URL: ${{ steps.ready.outputs.artifact-url }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${YANDEX_ARTIFACT_ID}/zip" > "${RUNNER_TEMP}/yandex-upload-ready.zip"
          python3 scripts/check-yandex-build.py "${RUNNER_TEMP}/yandex-upload-ready.zip" --compare dist --report "${RUNNER_TEMP}/yandex-upload-validation.json"

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
