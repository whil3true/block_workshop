name: Quality gates and Pages preview
on: [push, pull_request, workflow_dispatch]

jobs:
  verify:
    # Keep the runner compatible with the locked Playwright release.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- --project=${{ matrix.browser }} --max-failures=3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-and-results-${{ matrix.browser }}
          path: |
            dist
            test-results
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && matrix.browser == 'chromium'
        uses: actions/configure-pages@v5
      - name: Upload Pages build
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && matrix.browser == 'chromium'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
